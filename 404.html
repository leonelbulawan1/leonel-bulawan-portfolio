<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found – Leonel Bulawan</title>
<link rel="icon" href="/assets/icons/app/icon-192.png">
<meta name="theme-color" content="#1a0b3d">
<style>
:root{--night:#1a0b3d;--violet:#5b0fd6;--ink:#1d1630;--muted:#625b78;--bg:#faf9fc;--line:#e6e0f2;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f0a22;--ink:#ece8f7;--muted:#a39cbf;--line:#2a2148;--card:#191134}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.6 "Inter","Segoe UI",system-ui,sans-serif}
main{max-width:520px;text-align:center}
.logo{display:inline-grid;place-items:center;width:72px;height:72px;border-radius:16px;background:var(--night);margin-bottom:28px}
.logo img{width:52px;height:52px}
.code{margin:0;font:800 14px/1 "Manrope","Inter",sans-serif;letter-spacing:.2em;color:var(--violet)}
h1{margin:10px 0 10px;font:800 clamp(28px,6vw,40px)/1.15 "Manrope","Inter",sans-serif;letter-spacing:-.02em}
p{margin:0 0 28px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--violet);background:var(--violet);color:#fff}
a.btn:hover{background:#6d28f0;border-color:#6d28f0}
a.btn.outline{background:transparent;color:var(--violet)}
@media (prefers-color-scheme:dark){a.btn.outline{color:#c4b0ff;border-color:#a78bfa}}
a.btn.outline:hover{background:var(--violet);color:#fff}
a:focus-visible{outline:2px solid #8b5cf6;outline-offset:2px}
</style>
</head>
<body>
<main>
  <span class="logo"><img src="/assets/icons/app/icon-192.png" alt="Leonel Bulawan logo"></span>
  <p class="code">ERROR 404</p>
  <h1>This page could not be found</h1>
  <p>The link may be broken, or the page may have moved. You can head back to the portfolio from here.</p>
  <div class="acts"><a class="btn" href="/">Back to Home</a><a class="btn outline" href="/#projects">View projects</a></div>
</main>
</body>
</html>
